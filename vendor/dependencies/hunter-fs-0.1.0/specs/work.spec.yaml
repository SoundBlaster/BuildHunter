apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: hunter.fs.work
  title: Scoped recursive-work coordination
  version: 0.1.0-draft.2
  status: draft
intent:
  summary: Queue opaque recursive tasks and launch scoped workers with shutdown on
    coordinator exit or worker panic.
scope:
  boundedContext: work_coordination
  includes:
  - Generic LIFO task ownership, close/reject/release, blocking wait, scoped worker
    clones, positive caller cap and panic-triggered shutdown.
  excludes:
  - Filesystem selection, product classification, result aggregation, cloud/QoS setup,
    in-flight I/O interruption, detached threads and a whole-process RSS guarantee.
provides:
  capabilities:
  - id: hunter.fs.work
    role: primary
    summary: Support recursive task expansion with generic queue shutdown and scoped
      worker launch.
requires:
  capabilities: []
interfaces:
  inbound:
  - id: queue
    kind: library
    summary: WorkQueue<T>::with_limits/try_push_weighted/push/pop/snapshot/close/close_on_drop; QueueLimits and typed ownership-preserving rejection; scoped workers and worker_count(maximum).
  outbound: []
constraints:
- id: ownership
  level: MUST
  statement: pop consumes jobs in LIFO order. Closing rejects future pushes, wakes
    all waiters and releases queued payloads outside the mutex. In-flight jobs remain
    worker-owned until they finish/drop.
- id: scope_lifetime
  level: MUST
  statement: Borrow workers from caller-owned std::thread::Scope; spawn_workers only
    launches, and outer scope completion is the join boundary. Coordinator MUST retain
    close_on_drop inside the scope so closing happens before join on normal exit/unwind.
- id: panic
  level: MUST
  statement: Worker panic closes queue before that worker exits. Other idle workers
    may then return; std scope propagates worker panic after joining. Host owns result
    channel closure and active task cancellation. Generic payload destructors/closure
    Clone must not panic during unwinding.
- id: budgets
  level: MUST
  statement: Count/cap is positive and worker_count limits available parallelism to
    the caller maximum. Default queue remains unbounded for compatibility; explicit positive max_tasks/max_weight reject admission without blocking. Weight units are caller-defined, not allocator accounting. Rejection returns the task and Closed/TaskLimit/WeightLimit. Pop/close release charged weight, and snapshots retain high-water counters. This does not interrupt I/O or bound RSS/payloads retained elsewhere.
effects:
  sideEffects:
  - id: threads
    kind: event_emit
    summary: Launch scoped threads, synchronize task ownership and invoke host worker
      closures; consumer effects remain caller-owned.
evidence:
- id: work_source
  kind: source
  path: crates/hunter-fs-core/src/work.rs
  supports:
  - intent.summary
  - interfaces
  - constraints.ownership
  - constraints.scope_lifetime
  - constraints.panic
  - constraints.budgets
- id: work_docs
  kind: documentation
  path: crates/hunter-fs-core/README.md
  supports:
  - scope
  - constraints.scope_lifetime
  - constraints.budgets
provenance:
  sourceConfidence:
    intent: high
    boundary: high
    behavior: medium
  notes:
  - R5 foundations add opt-in admission limits and high-water accounting; callers must handle full admission explicitly. This library layer does not configure application defaults. Fresh source/run identities are under validation/resource-foundations-20261024.
  - Queue/scoped launch extracted from BuildHunter bb21773. Draft observed contract;
    filesystem recursion/status remain host-owned. Scope join is not the return of
    spawn_workers.
implementationBindings:
- id: work_implementation
  scope: component
  language: rust
  files:
    owned:
    - crates/hunter-fs-core/src/work.rs
    border:
    - crates/hunter-fs-core/src/lib.rs
