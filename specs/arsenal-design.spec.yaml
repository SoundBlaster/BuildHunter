apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: arsenal.design.catalog
  title: Arsenal target catalog
  version: 0.1.0-draft.1
  status: draft
intent:
  summary: Supply privately maintained commercial rule packages and fixtures consumable by the same public Rifle runtime.
scope:
  boundedContext: module_recovery_and_design
  includes:
  - Plugin manifests/IR, ecosystem explanations, fixtures and pinned catalog compatibility for Store composition.
  excludes:
  - Runtime evaluator, filesystem privileges, executable plugins, public base rules removal and secrecy guarantees
    for delivered binaries/data.
provides:
  capabilities:
  - id: arsenal.design.catalog
    role: primary
    summary: Supply privately maintained commercial rule packages and fixtures consumable by the same public Rifle
      runtime.
requires:
  capabilities:
  - id: rifle.design.rules
    optional: false
    summary: Validate and interpret the same portable rule contract as public plugins.
interfaces:
  inbound:
  - id: consumer_interface
    kind: library
    summary: 'Proposed versioned data bundle: rule IR, provenance/digest, compatibility, positive/negative fixtures;
      private packaging path/license remain draft.'
    operations:
    - name: proposed_catalog_bundle
      summary: 'Proposed versioned data bundle: rule IR, provenance/digest, compatibility, positive/negative fixtures;
        private packaging path/license remain draft.'
  outbound: []
constraints:
- id: data_only
  level: MUST
  statement: Arsenal contains data authored with Rifle SDK or portable format, not a separate interpreter or rules
    privileged to execute code.
- id: fixtures
  level: MUST
  statement: Each target needs positive/negative and relevant collision fixtures. Store private CI pins compatible
    modules/catalog and validates parity/performance without publishing private definitions or secrets.
- id: base_and_license
  level: MUST
  statement: Keep current MIT base checks public in BuildHunter. Choose the license for new private content separately;
    removing published code cannot revoke existing MIT grants.
- id: delivered_visibility
  level: MUST
  statement: Private source hosting does not prevent extracting shipped rule resources or recreating predicates. Catalog
    value is coverage, maintenance and convenience, not hidden algorithm protection.
effects:
  sideEffects: []
evidence:
- id: source_0
  kind: documentation
  path: docs/modular-architecture.md
  supports:
  - intent.summary
  - scope
  - interfaces
  - provides.capabilities
  - constraints.data_only
  - constraints.fixtures
  - constraints.base_and_license
  - constraints.delivered_visibility
- id: source_1
  kind: adr
  path: docs/adr/0003-declarative-plugins-and-product-boundaries.md
  supports:
  - scope
- id: source_2
  kind: documentation
  path: docs/plugin-delivery-plan.md
  supports:
  - scope
provenance:
  sourceConfidence:
    intent: high
    boundary: medium
    behavior: unknown
  notes:
  - Target requirement, not an implemented API. Names/product direction accepted; detailed requirements remain draft.
  - Source baseline 48badf9e097783505151dd47fbafe290f0af25e2; per-file hashes, dirty exclusion and map identities
    are in specs/evidence/modules-20261013/source-identity.json.
  - Claim origin, review state, assembly obligations and unresolved decisions are in specs/claim-matrix.md.
implementationBindings: []
