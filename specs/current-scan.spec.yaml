apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.current.scan
  title: Current scanner mechanics
  version: 0.1.0-draft.22
  status: draft
intent:
  summary: Observe policy-selected filesystem roots with streaming sizes, warnings, cancellation and optional process
    accounting.
scope:
  boundedContext: module_recovery_and_design
  includes:
  - scan_with_policy and current worker traversal/measurement, including optional macOS bulk metadata.
  - Allocated/apparent sizing, terminal status, managed-location admission, cloud guards, policy/emit callback lifecycle.
  - scan_with_candidate_observer bypasses legacy name/marker gates for independent consumers; plugin I/O/routing
    is covered by buildhunter.plugin.scanner.
  excludes:
  - Full generic Hunter scanner recursion/worker/lifecycle extraction.
  - Constant whole-scan memory or race-free filesystem snapshots.
  - Contents search or deletion.
provides:
  capabilities:
  - id: buildhunter.current.scan
    role: primary
    summary: Observe policy-selected filesystem roots with streaming sizes, warnings, cancellation and optional
      process accounting.
requires:
  capabilities:
  - id: platform.filesystem.metadata
    optional: false
    summary: The host supplies filesystem enumeration and metadata with its effective permissions.
  - id: hunter.fs.portable
    optional: false
    summary: Exact vendored std-only upstream directory iteration and metadata-byte primitives; host owns open/guards/recursion.
  - id: hunter.fs.work
    optional: false
    summary: Generic task queue/shutdown/scoped launch; host supplies coordinator guard, workers, platform setup and result accounting.
  - id: hunter.fs.directory_tasks
    optional: false
    summary: Opaque task/listing/result types and aligned measurement plans; the worker helper publishes Listed first, host provides guarded backends and applies final policy.
  - id: hunter.fs.child_traversal
    optional: false
    summary: Ordered host-selected directory requests and indexed leaf observations; host owns cloud/stop effects, scheduling, ancestry and status.
  - id: hunter.fs.task_ledger
    optional: false
    summary: Non-reused IDs, opaque listing/deferred state and expected-response accounting; host owns protocol order, queues, join and final status.
  - id: hunter.fs.subtree_progress
    optional: false
    summary: Saturating byte totals, partial/root/pending progress and one-shot completions; host routes contributions, checks readiness and orders final events.
  - id: hunter.fs.scan_execution
    optional: false
    summary: Serial result waiting/checkpoints and receipt-before-stop dispatch; host owns setup, interpretation, finalization and worker join.
  - id: hunter.fs.backend
    optional: false
    summary: Native path metadata/listing seam and one-call root observation; host retains admission, guarded probes, bulk and marker-following policy.
  - id: hunter.fs.directory_worker
    optional: false
    summary: Shared synchronous worker protocol publishes listing before measurement; host retains guarded listing/prefetch/backend/timing callbacks and actual scope lifetime.
  - id: hunter.fs.directory_listing
    optional: false
    summary: Owned listing/error collection plus visit outcome with an opaque synchronous entry observer; host owns marker context and post-list hooks.
  - id: hunter.fs.measurement_backend
    optional: false
    summary: Typed directory/prepared-file backend and shared slot loop; native/bulk policy, guards, errors, timers and status stay host-owned.
  - id: hunter.fs.scoped_session
    optional: false
    summary: Helper startup, scoped worker launch, caller-thread coordinator and stop/close-before-join fence; host retains admission, QoS and terminal policy.
  - id: hunter.fs.root_admission
    optional: false
    summary: Opaque host preflight before one root observation; host interprets skip/error and chooses scheduling/finalization.
  - id: hunter.fs.scan_engine
    optional: false
    summary: Compose root/task execution, serial child routing and deferred selected metadata around the product host.
  - id: hunter.fs.entry_processing
    optional: false
    summary: Serial child routing and selected root/worker/fallback metadata reconciliation around product callbacks.
  - id: hunter.fs.traversal_coordinator
    optional: false
    summary: Owned root admission and task/response ledger around opaque caller-thread product handler.
  - id: hunter.fs.scan_assembly
    optional: false
    summary: Compose owned queue and single-use launch inside guarded backend lifetime.
  - id: hunter.fs.backend_lifetime
    optional: false
    summary: Same-thread guard/backend construction and reverse cleanup; Hunter owns Darwin thread-policy RAII, host owns placement/status.
  - id: hunter.fs.darwin_bulk_metadata
    optional: true
    summary: Opt-in macOS batch acquisition/checked decoder; host holds the worker guard.
  - id: hunter.fs.prepared_directory_sizes
    optional: false
    summary: Pure owned per-name result/error consumption and missing/Unsupported decision.
  - id: hunter.platform.requested_qos
    optional: false
    summary: Explicit best-effort requested QoS capture/apply; host chooses calling thread and worker/helper placement.
  - id: hunter.platform.process_resources
    optional: false
    summary: Independent optional current-process cumulative CPU nanoseconds and resident bytes; host computes deltas/rates.
interfaces:
  inbound:
  - id: consumer_interface
    kind: library
    summary: 'Existing Rust API: borrowed root/options/control and serial policy/emit closures; returns ScanReport
      after scoped workers finish.'
    operations:
    - name: scan_with_policy
      summary: 'Existing Rust API: borrowed root/options/control and serial policy/emit closures; returns ScanReport
        after scoped workers finish.'
    - name: scan_with_candidate_observer
      summary: Observe every visited node with path, legacy fact envelope and actual entry kind; serial caller-thread
        callbacks and existing report codes.
  outbound: []
constraints:
- id: scoped_acquisition
  level: MUST
  statement: Experimental scan_with_candidate_access uses one explicit ScanAccess
    for admission, worker listings/measurements and coordinator fallback through join.
    Scoped failures never retry through native paths or pathname bulk metadata;
    scoped error decoration never probes a native pathname and preserves backend
    errno/kind/message rather than diagnosing a replacement object;
    cached result/error precedence stays unchanged. File slots changed to links or
    directories produce a change notice instead of counting target/link bytes.
    Default CLI/GUI entrypoints retain standard acquisition and policy.
- id: process_platform_assembly
  level: MUST
  statement: Capture requested QoS at the existing coordinator setup point and apply
    it on workers and the optional sampler before their bodies. Ignore platform set
    failures as before. Read current-process CPU baseline during profile construction
    and CPU/RSS on samples through Hunter. BuildHunter owns interval, deltas,
    decreasing-counter handling, averages/peaks, profile ABI and presentation. Missing
    counters remain unavailable independently. No automatic scheduling or sampling
    is introduced by Hunter, and process totals do not become per-scan attribution.
- id: scan_lifetime
  level: MUST
  statement: For this existing entrypoint, run workers within the scan call and finish them before returning; policy
    and emit execute serially on the coordinator, not concurrently on workers.
- id: sizes
  level: MUST
  statement: Default Unix sizes use metadata.blocks().saturating_mul(512); apparent uses metadata.len(); non-Unix falls back to
    apparent. Sum only non-nested roots; hard links are counted by pathname. These are not reclaimable bytes.
- id: terminal
  level: MUST
  statement: Map failure, cancellation, I/O errors and observed disappearance to Failed, Cancelled, Incomplete and
    CompletedWithChanges respectively; CompletedWithChanges can retain partial sizes and notices.
- id: symlink_scope
  level: MUST
  statement: Traversal skips symbolic links; marker_is_file uses fs::metadata to resolve recognized symlinked marker
    files. This exception is observed, not a universal no-follow guarantee.
- id: backend_lifetime
  level: MUST
  statement: Run coordinator and each worker through Hunter with_guarded_backend.
    Enter Hunter NonMaterializingIoGuard before backend preparation; retain it through
    body completion and owned backend drop. Coordinator body includes sampler/worker
    join, final profiles and Finished. Worker body owns WorkerAdapter through the
    directory-worker loop; prepared measurement state drops before the adapter/guard.
    Guard failure maps to existing Warning/Finished(Failed) or SetupFailed paths.
    Actual backend factories are infallible borrowed Probes or WorkerAdapter assembly;
    generic backend-setup errors are uninhabited in this integration. Cloud path
    policy and dataless error decoration stay product-owned. The public guard alias
    is source-compatible. Restoration remains best effort on ordinary unwind, not abort.
- id: cloud_guard
  level: MUST
  statement: Enter the macOS non-materialization guard before traversal and on workers; guard setup failure ends
    the scan with Failed. Other OS/providers do not acquire a universal no-download guarantee.
- id: managed_locations
  level: MUST
  statement: On macOS, lexically exclude each user's Library/Mobile Documents,
    Library/CloudStorage and Library/Developer/CoreDevice/DeviceFS namespaces,
    including their descendants and the /System/Volumes/Data/Users spelling.
    Normalize dot/parent components without filesystem resolution; do not use HOME.
    Do not match the Shared account; preserve exact path-component boundaries. Selected excluded
    roots are warned before root metadata, markers or listings; recursively discovered
    excluded paths are warned and skipped before child routing/classification.
    A skipped namespace preserves warning/Incomplete semantics, with affected artifact
    ancestry partial. DeviceFS is a connected-device namespace, not a local build
    inventory. This is product path policy even when the namespace is unmounted,
    not detection of every mount/provider or a symlink confinement guarantee.
    Non-macOS admission is unchanged.
- id: memory_scope
  level: MUST
  statement: 'Apply buildhunter.scan.resources per-scan retention/admission limits. Completed ledger slots release immediately, worker responses and profile pending samples are bounded. Do not infer a whole-process RSS ceiling from estimated payload quotas; consumer report copies, opaque allocations and multiple consumers/windows require separate accounting.'
- id: result_execution
  level: MUST
  statement: The result pump checks outstanding work and stop before checkpoint/receive,
    retires each received response before the post-receipt stop check, and dispatches
    only if running. Timed profile waits repeat checkpoints without receipt on timeout.
    Blocking waits and disconnected-channel behavior remain unchanged; channel loss
    breaks the loop but does not itself override the host final-status precedence.
    ArtifactHandler initializes root work and finalizes open results; Hunter
    TraversalCoordinator owns admission/pump/task bookkeeping and reports loop outcome
    separately from product status. Hunter scoped session
    stops host helpers and closes the queue inside the outer thread scope; the
    product session publishes Finished only after actual join.
- id: root_admission
  level: MUST
  statement: Delegate initial managed-location preflight and metadata sequencing to Hunter
    ScanEngine::run through TraversalCoordinator calling admit_root. ArtifactHandler Skipped handling
    warns and declines initialization before the result pump/finish callback;
    Unavailable warns but retains the existing pump/finalization path. Observed
    Directory/Entry uses original metadata and existing scheduling/classification.
    Cloud guard lifetime, lexical managed-location policy and product status stay local;
    no stop check is added before root observation.
- id: root_backend
  level: MUST
  statement: After managed-location admission, observe the selected root once through
    the guarded Probes backend. Reuse returned metadata for directory startup or
    selected-entry measurement, even when startup was pre-cancelled. Missing selected
    roots remain warnings/Incomplete rather than ordinary child churn. Final root
    symlinks are entries and are not followed; intermediate components/read_dir
    remain path-based with existing race limits. Probes preserves error decoration,
    hooks and counters; marker following and the decision to request bulk acquisition stay product-owned.
- id: directory_worker
  level: MUST
  statement: After worker materialization guard setup, execute directory tasks through
    Hunter DirectoryWorker. Publish Listed before measurement and send a returned
    cancelled/partial Measured result. On receiver rejection stop before further
    measurement or another task. Keep marker/prefetch interpretation and opt-in timers
    in the host adapter. Hunter owns requested batch acquisition/lookup; guarded preparation
    policy, portable fallback effects and error decoration stay in the host measurement module. Guard setup failure still sends SetupFailed; panic/queue
    closure and terminal publication retain their enclosing scope obligations.
- id: directory_listing
  level: MUST
  statement: Open the directory through guarded Probes and collect entries/errors via
    Hunter collect_directory. Invoke local observe_legacy_marker per successful entry
    before storing it, without delaying marker I/O until after enumeration. Regular
    recognized files and intentional symlink-marker following retain their prior
    bit/error behavior. Retain child/context on observer error; disabled legacy
    policy performs no marker probes. Preserve visitor order/stop/outcome semantics
    and invoke the test post-list hook after all outcomes except OpenFailed.
- id: measurement_backend
  level: MUST
  statement: WorkerAdapter times measurement::measure_directory; local MetadataBackend
    observes directory metadata then prepares owned file-measurement state through
    Hunter measure_with. Prepare after directory errors/pre-cancellation and preserve
    original slots and partial outcomes. Delegate requested Darwin acquisition and
    prepared consume-once lookup to Hunter. Keep file-slot eligibility, injected test
    error precedence, Unsupported/missing portable fallback effects, counters and error
    decoration in the host module at the same boundaries. Retain the outer worker guard through
    prepared state use/drop; queues, receiver, joins and status are unchanged.
- id: scoped_session
  level: MUST
  statement: Product scan_session::run selects the guard/backend constructors and owns
    profile/QoS setup, host construction, final status and event/report publication.
    Hunter with_scan_session_limits owns guarded backend lifetime, the empty shared queue
    and capped worker-count selection. Its non-cloneable ScanSession token is
    consumed once to launch scoped work; root admission stays inside the guarded caller coordinator. Hunter
    starts host sampler helpers, launches workers, invokes coordinator on caller
    thread, drops helper-stop guard, closes queue and joins before returning. Move
    receiver into coordinator and release unread responses before return/unwind
    joins. Worker SetupFailed still passes through the existing host result pump.
    Admission failure emits Warning then Finished(Failed) without starting work;
    successful scoped completion drains final profiles before one Finished. Callback
    or worker panic unwinds without product Finished. Keep guards through join.
- id: session_assembly
  level: MUST
  statement: Delegate guard/backend scope, queue construction and capped parallelism
    to with_scan_session_limits and consume ScanSession::run_engine once. Allocate bounded ScanChannel
    at the existing point before profile/QoS capture and clone the worker producer before
    launch. EngineLaunch passes guarded Probes, raw root, cloud preflight and idle interval.
    Hunter drops the original producer before caller-thread ArtifactHandler construction
    and begin_profile, invokes ScanEngine and releases unread receiver before collect.
    Product collect extracts report inputs and releases progress before helper stop/queue
    closure/join, matching the original lifetime. Factory/engine panic skips collect;
    collection panic still joins before outer backend/guard release. Worker panic may
    surface after collection at join, so keep final Profile/Finished after actual join.
    Root admission policy, worker/helper effects/QoS, byte/profile/status mapping and
    final event/report publication remain local; no extra stop probe, I/O or thread.
- id: traversal_coordinator
  level: MUST
  statement: Replace private Scanner with ArtifactHandler implementing Hunter
    ScanHandler. Hunter engine delegates to the coordinator owning TraversalTasks and borrows the
    scoped queue; preserve reserve/telemetry/publish ordering, receipt accounting,
    speculative measurement retirement, root outcome handling and partial completion
    callback timing. Keep marker/classification/ancestry, child-selection policy, selected-size
    membership, warning/status interpretation and final report/events in product code.
    Handler has no queue/ledger fields. Ledger releases after handler finish and before
    coordinator return; unread receiver still releases before the enclosing scope join.
- id: entry_processing
  level: MUST
  statement: ArtifactHandler supplies checkpoint/access/stop, directory scheduling and
    file selection through ScanHandler. Engine ChildTraversal routing preserves original
    indices, context clones and stop prefix; release listing before selected measurement.
    Hunter PendingSelection owns SelectedMeasurementPlan plus opaque ArtifactBranch;
    root/worker/fallback precedence and original slot lookup retain cached errors without
    retry. Missing/out-of-range/consumed slots fall back once through guarded Probes.
    Keep selected-entry checkpoint cadence, byte mode/aggregation, affected ancestry
    and partial completion in host callbacks. finish_directory runs before selected/
    cached buffers and branch state release; no cancellation check or I/O is added.
- id: scan_engine
  level: MUST
  statement: ArtifactHandler uses consuming ScanEngine run/drive inside the existing
    scoped session. After receipt/stop handling, host response decodes SetupFailed or
    typed DirectoryResult. Engine lists telemetry before taking state, notifies promised
    measurement count, and calls host preparation. Abandon retains stop/partial policy;
    Complete records ignored speculative work then finishes the branch. Traverse routes
    children, completes empty unselected work, defers selected work when promised, or
    resolves immediately otherwise. Measured consumes deferred selection once; ignored
    responses have no measurement/status effects. Keep guards, receiver-before-join and
    final Profile/Finished after join unchanged. Drained is not a success status.
effects:
  sideEffects:
  - id: read_metadata
    kind: filesystem_read
    summary: Enumerate directories and read metadata/marker existence; no content scan.
  - id: publish_events
    kind: event_emit
    summary: Invoke the supplied event observer, which can have consumer-defined effects.
