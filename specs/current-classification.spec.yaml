apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.current.classification
  title: Current artifact classification and filters
  version: 0.1.0-draft.1
  status: draft
intent:
  summary: Describe the existing artifact vocabulary and client-specific decisions that must be disentangled before
    extracting Hunter.
scope:
  boundedContext: module_recovery_and_design
  includes:
  - Rust candidate/prefetch/name-marker catalog and CLI policy; Swift SpecificationCore policy and immutable filter
    snapshots.
  excludes:
  - A single existing plugin interpreter.
  - Identical CLI/GUI environment and kind behavior.
  - Arbitrary custom names reaching a callback through the current hard-coded prefilter.
provides:
  capabilities:
  - id: buildhunter.current.classification
    role: primary
    summary: Describe the existing artifact vocabulary and client-specific decisions that must be disentangled before
      extracting Hunter.
requires:
  capabilities: []
interfaces:
  inbound:
  - id: consumer_interface
    kind: library
    summary: Existing rust_cli_policy / BuildHunterScanPolicy.decision and shared filter catalog; names/flags and
      current numeric classification codes are artifact-specific.
    operations:
    - name: classify
      summary: Existing rust_cli_policy / BuildHunterScanPolicy.decision and shared filter catalog; names/flags and
        current numeric classification codes are artifact-specific.
  outbound: []
constraints:
- id: selection
  level: MUST
  statement: Candidate and prefetch paths use fixed artifact names and marker bits in src/lib.rs; changing only the
    callback cannot introduce arbitrary names beyond that gate.
- id: client_profiles
  level: MUST
  statement: CLI defaults exclude environments and retains nested rows; GUI includes environments by default and accepts
    outer roots. CLI named-environment detection and GUI any-name pyvenv.cfg detection are not interchangeable.
- id: taxonomy
  level: MUST
  statement: CLI bytecode/metadata kinds and tox/nox cache classification differ from GUI cache/testEnvironment presentation.
    Export preserves scannerKind when available; migration must explicitly choose parity or approved changes.
- id: filter_snapshot
  level: MUST
  statement: Capture GUI exclusion IDs once per scan; excluded recognized roots traverse to allow nested eligible
    discoveries. Unknown stored IDs remain in preferences and unrecognized classifications remain included.
- id: catalog_lifetime
  level: MUST
  statement: bh_search_filter_catalog_json exposes immutable process-lifetime UTF-8 descriptors; this is a built-in
    filter catalog, not user-plugin loading or validation.
effects:
  sideEffects: []
