apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.current.classification
  title: Current artifact classification and filters
  version: 0.1.0-draft.5
  status: draft
intent:
  summary: Classify default CLI and GUI candidates through immutable versioned plugin catalogs while preserving client profiles.
scope:
  boundedContext: module_recovery_and_design
  includes:
  - Default catalog-derived candidate dispatch, marker requests, CLI/GUI profiles and immutable exclusion snapshots.
  - Retained numeric Rust/Swift policy APIs for compatibility and differential tests.
  excludes:
  - User plugin installation and a Swift authoring SDK.
  - Identical CLI/GUI environment and kind behavior.
  - Descriptor confinement or resource-budget acceptance for the compatibility client scan.
provides:
  capabilities:
  - id: buildhunter.current.classification
    role: primary
    summary: Route default client decisions through validated catalog targets and explicit admission profiles.
requires:
  capabilities:
  - id: buildhunter.catalog.scan
    optional: false
    summary: Catalog decisions, client admission, dynamic facts and measurement.
  - id: buildhunter.catalog.snapshot
    optional: false
    summary: Validated descriptors, identity and exclusions.
interfaces:
  inbound:
  - id: consumer_interface
    kind: library
    summary: CatalogSnapshot, scan_client and SearchFilterSettings; numeric policy APIs remain compatibility entrypoints.
    operations:
    - name: classify
      summary: Evaluate catalog-selected Rifle rules against candidate-specific observations; preserve target IDs.
  outbound: []
constraints:
- id: selection
  level: MUST
  statement: Default clients observe every candidate through scan_client, derive marker requests from enabled bindings and classify via conservative name dispatch. Legacy fixed names/marker bits and speculative prefetch are bypassed for this path; retained numeric APIs still have their original vocabulary.
- id: client_profiles
  level: MUST
  statement: CLI defaults exclude environments and retains nested rows; GUI includes environments by default and accepts
    outer roots. CLI named-environment detection and GUI any-name pyvenv.cfg detection are not interchangeable.
- id: taxonomy
  level: MUST
  statement: CLI bytecode/metadata kinds and tox/nox cache classification differ from GUI cache/testEnvironment presentation.
    Versioned profile presentationKind preserves these differences; no harmonization is implied.
- id: filter_snapshot
  level: MUST
  statement: Capture GUI exclusion IDs once per scan; excluded recognized roots traverse to allow nested eligible
    discoveries. Unknown valid stored IDs remain in preferences and the immutable snapshot; classification ambiguity/unavailability is diagnostic rather than a silently selected target.
- id: catalog_lifetime
  level: MUST
  statement: Settings/list-filters consume validated plugin descriptors and stable target IDs. Full digest identifies content independently of exclusions; each running scan owns a snapshot. Legacy bh_search_filter_catalog_json supplies presentation ordering/matching hints only, not default membership or classification.
