provenance:
  sourceConfidence:
    intent: high
    boundary: medium
    behavior: medium
  notes:
  - R4 default cutover uses legacy-file-markers/1 to preserve R2 marker links/selected-root context.
    This is compatibility migration, not acceptance of a unified C3 policy or R3 descriptor safety.
    Current source/run hashes and limits are in validation/r4-client-cutover-20261023.
  - R2 freezes reviewed client expectations at main 1fd905620c0d5c0317c6b08123cfe5b0653253c2.
    CLI and deterministic core witnesses are recorded in validation/migration-parity-20261022;
    Swift witnesses use the same corpus through the real GUI event source. Local compilation passed;
    local test-host launch hung before connection (upper-layer receipt), so execution awaits CI.
    No runtime policy or accepted requirement changes.
  - Recovered descriptive constraints from pinned source, not runtime conformance or owner acceptance.
  - Source baseline 48badf9e097783505151dd47fbafe290f0af25e2; per-file hashes, dirty exclusion and map identities
    are in specs/evidence/modules-20261013/source-identity.json.
  - Claim origin, review state, assembly obligations and unresolved decisions are in specs/claim-matrix.md.
  - Listing marker interpretation moved into local observe_legacy_marker at c70724d469d823774450bc387ecb90be1c5e2905.
    The marker catalog, candidate/prefetch decisions, client profiles and filters are unchanged.
    Marker acquisition effects belong to current.scan/directory_listing, not this decision boundary.
    Binding paths are refreshed; local Rust witnesses do not establish new Swift UI acceptance.
