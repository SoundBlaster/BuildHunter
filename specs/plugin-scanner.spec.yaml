apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.plugin.scanner
  title: Opt-in catalog-driven scanner integration
  version: 0.1.0-draft.5
  status: draft
intent:
  summary: Acquire scoped plugin marker facts and route supplied catalog decisions into measured artifacts with live metadata and diagnostics.
scope:
  boundedContext: plugin_scanner_integration
  includes:
  - Independent library using current traversal with all-candidate observation and pinned Hunter macOS/Linux descriptor acquisition.
  - Immutable catalog/exclusions, arbitrary target metadata, streaming results, cancellation and typed diagnostics.
  excludes:
  - Default CLI/GUI/FFI policy migration, complete baseline plugin parity, Windows marker backend, Store delivery and whole-engine safety/resource acceptance.
  - Atomic filesystem snapshots, stable cross-pass entry identity, bounded report memory and throughput claims.
provides:
  capabilities:
  - id: buildhunter.plugin.scan
    role: primary
    summary: Scan through an immutable plugin catalog without the legacy name/marker gate.
requires:
  capabilities:
  - id: buildhunter.current.scan
    optional: false
    summary: Shared traversal, size accounting, scoped workers, cancellation, profile and cloud guard lifetime.
  - id: buildhunter.plugin.policy
    optional: false
    summary: Validated catalog, active bindings, three-valued outcomes and stable target descriptors.
  - id: hunter.fs.scoped_metadata
    optional: false
    summary: Pinned upstream Unix metadata primitive; host retains materialization policy and maps outcomes to plugin facts.
  - id: hunter.fs.scoped_filesystem
    optional: false
    summary: Shared selected-root anchor, no-follow listings and prepared metadata;
      host retains per-thread guards and translates partial/error semantics.
interfaces:
  inbound:
  - id: plugin_scan
    kind: library
    summary: scan(root, catalog, ScanOptions, ScanControl, event observer) -> Result<PluginScanReport, ScanError>.
  outbound:
  - id: live_updates
    kind: library
    summary: Serial caller-thread artifact discovery/completion, typed candidate diagnostics, I/O warnings, profiles and terminal status.
constraints:
- id: traversal_scope
  level: MUST
  statement: On macOS/Linux select one ScopedFilesystem for root admission, listings,
    worker sizing and coordinator fallback. Marker scopes clone the same root anchor.
    Refuse intermediate symlinks, inspect final metadata no-follow, retain one opened
    directory through a prepared pass and never retry scoped failures through paths
    or pathname bulk metadata. A measured file changed to a link/directory contributes
    no bytes and produces a change notice. Independent passes remain live observations.
- id: candidate_gate
  level: MUST
  statement: Observe every visited node independent of built-in names and marker bits; .git remains host-pruned. Preserve exact node kinds and lossless paths; invalid UTF-8 names stay unavailable.
- id: marker_scope
  level: MUST
  statement: On supported Unix backends, anchor marker metadata to the selected root descriptor, open intermediate components without following links, and inspect final entries without following links or reading contents. Root parent is out_of_scope; symlink markers are false.
- id: effective_acquisition
  level: MUST
  statement: Request only active deduplicated bindings. Unknown placeholders may eliminate I/O only when pure evaluation has no unknown targets; final decisions must use actual observations when required. Disabled-only bindings cause no observations.
- id: routing
  level: MUST
  statement: Found carries full target metadata and creates one artifact. Ambiguous, Indeterminate, NoMatch and exclusions do not prune descendants. Typed policy diagnostics remain distinct from traversal I/O warnings and are delivered during candidate processing without waiting for a core event; observers may cancel before descendants are processed.
- id: lifecycle
  level: MUST
  statement: Retain catalog digest and exclusions in the report; keep immutable catalog/control/access alive until scoped workers finish; preserve inherited size/cancellation/partial events and guard restoration. Cancellation request alone does not prove completion.
- id: compatibility
  level: MUST
  statement: Keep this package outside root CLI Cargo resolution and retain its strict acquisition API separately from the default clients compatibility profile and legacy numeric FFI. Unsupported acquisition backends fail closed before callbacks. Directory-root replacement
    stays on the pinned original root; display paths are not durable action handles
    and no atomic or cross-pass identity guarantee is inferred.
- id: dependency_identity
  level: MUST
  statement: In this repository's independent scanner workspace, pin the Hunter facade
    to the same upstream revision as vendor provenance and patch its transitive core
    to the application's verified vendored source. Locked active graphs contain one
    core; policy-only and default CLI graphs remain separate. Rifle stays exactly
    pinned. The workspace root owns Cargo patches; downstream consumer workspaces
    must supply their own resolution policy, so no global single-core guarantee is made.
effects:
  sideEffects:
  - id: metadata_reads
    kind: filesystem_read
    summary: Descriptor directory traversal/sizing and scoped no-follow marker metadata reads; no marker contents or filesystem writes.
  - id: events
    kind: event_emit
    summary: Invoke caller-supplied synchronous observer; consumer effects remain caller-owned.
evidence:
- id: integration_source
  kind: source
  path: crates/buildhunter-plugin-scanner/src/lib.rs
  supports: [intent.summary, interfaces, constraints.candidate_gate, constraints.effective_acquisition, constraints.routing, constraints.lifecycle, constraints.compatibility]
- id: scope_source
  kind: source
  path: crates/buildhunter-plugin-scanner/src/scope.rs
  supports: [constraints.marker_scope]
- id: core_source
  kind: source
  path: src/lib.rs
  supports: [constraints.candidate_gate, constraints.lifecycle, constraints.compatibility]
- id: integration_tests
  kind: test
  path: crates/buildhunter-plugin-scanner/tests/scanning.rs
  supports: [constraints.candidate_gate, constraints.effective_acquisition, constraints.routing, constraints.lifecycle, constraints.marker_scope, constraints.traversal_scope]
- id: unsupported_tests
  kind: test
  path: crates/buildhunter-plugin-scanner/tests/unsupported.rs
  supports: [constraints.compatibility]
- id: scoped_upstream
  kind: documentation
  path: specs/evidence/hunter-scoped-access-20261023/upstream.md
  supports: [constraints.traversal_scope]
- id: integration_documentation
  kind: documentation
  path: docs/plugin-scanner-integration.md
  supports: [scope, constraints.compatibility, constraints.lifecycle]
- id: hunter_upstream
  kind: source
  path: specs/evidence/hunter-parent-review-20261014/upstream/scoped_metadata.rs
  supports: [constraints.marker_scope]
- id: dependency_graph_check
  kind: source
  path: scripts/verify_plugin_dependencies.py
  supports: [constraints.dependency_identity, constraints.compatibility]
- id: dependency_graph_tests
  kind: test
  path: scripts/test_plugin_dependencies.py
  supports: [constraints.dependency_identity]
provenance:
  sourceConfidence: {intent: high, boundary: high, behavior: medium}
  notes:
  - The rebased R3 stack includes the reviewed scoped-error diagnostic boundary;
    fresh post-rebase plugin checks and hashes are in plugin-scoped-review-20261023.
    Prior plugin-scoped-scan receipts remain historical for the pre-review inputs.
  - R3 now selects Hunter descriptor acquisition on macOS/Linux; source and tests are
    pinned in specs/validation/plugin-scoped-scan-20261023. The new shared-root and
    no-path-fallback constraints stay draft; C2/C3/C4 default migration is unchanged.
  - Owner authorized scanner integration after PR 67. New boundary remains draft; baseline client C2/C3/C4 migration is not accepted by this pilot.
  - Marker race tests are not a full traversal proof. Synthetic cloud metadata is not live provider evidence. Fresh execution receipts and source identities are separate from historical recovery.
  - Hunter partial extraction at 5c8f3c9a1a018039b5aea9b731f2fb744f625b5a; public upstream source/contract snapshots
    retain original ownership under specs/evidence/hunter-parent-review-20261014/upstream. Legacy traversal/default clients stay unchanged.
  - >-
    Facade pin aligned to c5354e973b5d1d90c438c94b78c06898ffe62500, matching vendored core provenance.
    ScopedMetadata source bytes equal the earlier 5c8f3c9 snapshot. This repository's
    scanner workspace patches the facade's core to the verified local snapshot;
    fresh graphs/tests and input identities are in specs/validation/plugin-alignment-20261022.
implementationBindings:
- id: integration
  scope: component
  language: rust
  files:
    owned:
    - crates/buildhunter-plugin-scanner/src/lib.rs
    - crates/buildhunter-plugin-scanner/src/scope.rs
    border:
    - src/lib.rs
    - vendor/hunter-fs-core/UPSTREAM.json
    - scripts/verify_plugin_dependencies.py
    - scripts/test_plugin_dependencies.py
    - crates/buildhunter-plugin-scanner/Cargo.toml
    - crates/buildhunter-plugin-scanner/Cargo.lock
    - crates/buildhunter-plugin-scanner/tests/scanning.rs
    - crates/buildhunter-plugin-scanner/tests/unsupported.rs
