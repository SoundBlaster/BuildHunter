apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.catalog.scan
  title: Catalog client scanning and event ABI
  version: 0.1.0-draft.6
  status: draft
intent:
  summary: Route immutable catalog decisions into measured findings and versioned client events without a per-candidate Swift callback.
scope:
  boundedContext: client_catalog_scan
  includes:
  - Dynamic candidate/marker acquisition, versioned CLI/GUI admission, stable target IDs, diagnostics and synchronous event transport.
  excludes:
  - New descriptor guarantees, user plugin installation, Store delivery and whole-process budgets.
provides:
  capabilities:
  - id: buildhunter.catalog.scan
    role: primary
    summary: Scan through a fixed catalog snapshot with complete target identity and terminal publication.
requires:
  capabilities:
  - id: buildhunter.catalog.snapshot
    optional: false
    summary: Immutable validated profile, descriptors, identity and exclusions.
  - id: buildhunter.current.scan
    optional: false
    summary: Every-node observation, measurement, cancellation, joined workers and raw paths.
interfaces:
  inbound:
  - id: client_scan_api
    kind: library
    summary: scan_client(root, snapshot, ScanOptions, include_environments, control, observer) -> CatalogScanReport.
  - id: catalog_event_abi
    kind: library
    summary: bh_scan_catalog_v1 with BHCatalogScanEvent version 1; metadata event 6, target IDs on discovery, typed diagnostic event 7, terminal unmeasured symlink discovery event 9; event 5 optionally carries resource-budget/loss JSON without changing its numeric profile payload. Optional bounded rule-profile event 8 precedes Finished when explicitly enabled.
  outbound: []
constraints:
- id: dynamic_selection
  level: MUST
  statement: Observe every candidate without the legacy fixed name gate or speculative root sizing. Derive rule marker requests from enabled catalog bindings and the conservative candidate index. Keep CLI environment admission as an explicit host-profile obligation.
- id: compatible_profiles
  level: MUST
  statement: Preserve R2 CLI nested findings/environment pruning and GUI outer-root/environment precedence. Prune .git only outside an artifact. The terminal-entry-file-or-symlink/2 profile recognizes a final regular file or symlink marker without following its target, and retains selected-root parent marker observations. This pathname API does not claim descriptor confinement; the opt-in scanner uses a separate scoped backend.
- id: potential_symlinks
  level: MUST
  statement: For a visited symlink, consider targets with a necessary matching name or a rule explicitly comparing node kind with symlink. Explicit kind comparisons use the actual entry kind; otherwise the target type and own markers remain unavailable. Parent markers may be observed under the selected profile. Report a single unambiguous possible target as a terminal symlink discovery with no target I/O or size. Retain other unavailable facts and conflicts as diagnostics; never count unknown size as zero or include it in measured totals.
- id: relative_path_fact
  level: MUST
  statement: Supply node.relative_path only when enabled rules need it, relative to the selected root, with slash-separated components and dot for the root. Reject out-of-scope, parent-component and non-UTF-8 paths as unavailable; never expose an absolute path through this fact.
- id: identity
  level: MUST
  statement: Findings retain full target descriptors through shared immutable ownership; reports retain profile, full digest and frozen exclusions. Numeric core labels remain transport placeholders and must not replace plugin identity.
- id: diagnostics
  level: MUST
  statement: Use the shared per-scan DiagnosticRetention gate. Surface ambiguous and unavailable classification as typed diagnostics and continue descendants unless cancelled or an explicit resource quota is reached. Diagnostics make otherwise completed results incomplete; cancellation and failure take precedence. Profile warning counters include diagnostics. Policy errors fail the scan and preserve an explanatory diagnostic within its retention quota; quota exhaustion preserves a reserved resource-limit warning. Target-map growth follows admitted findings.
- id: event_lifetime
  level: MUST
  statement: Emit metadata before scan events; deliver callbacks serially on the caller thread. All event pointers are borrowed only until callback return. Consumers retain control/catalog/context through return, after worker join. Preserve one completion per measured discovery; terminal symlink event 9 has no completion. Finished is last; invalid arguments return 3 before events.
- id: path_transport
  level: MUST
  statement: Preserve raw Rust path bytes in event payloads; presentation strings are not path capabilities. GUI action safety remains a separate consumer obligation and is not established by this ABI.
effects:
  sideEffects:
  - id: read_metadata
    kind: filesystem_read
    summary: Read metadata and directory entries under the inherited non-materializing scan guard; no content writes.
  - id: publish_events
    kind: event_emit
    summary: Invoke the serial observer, which can have consumer-defined effects.
evidence:
- id: client_source
  kind: source
  path: src/client_scan.rs
  supports:
  - constraints.dynamic_selection
  - constraints.compatible_profiles
  - constraints.potential_symlinks
  - constraints.relative_path_fact
  - constraints.identity
  - constraints.diagnostics
- id: bridge_source
  kind: source
  path: src/catalog_bridge.rs
  supports:
  - interfaces
  - constraints.event_lifetime
  - constraints.path_transport
- id: client_tests
  kind: test
  path: src/client_scan_tests.rs
  supports:
  - constraints.compatible_profiles
  - constraints.relative_path_fact
  - constraints.diagnostics
  - constraints.event_lifetime
provenance:
  sourceConfidence:
    intent: high
    boundary: high
    behavior: medium
  notes:
  - The owner authorized treating marker links as entries and reporting candidate links without following them. Historical migration fixtures remain unchanged; new witnesses cover the additional findings. This is not proof of descriptor confinement or Windows scoped acquisition.
implementationBindings:
- id: catalog_scan_sources
  scope: component
  source:
    repository: https://github.com/SoundBlaster/BuildHunter
    revision: 84ce408234e3f605933b3cd62bb1ec58c1d80013
  files:
    owned:
    - src/client_scan.rs
    - src/catalog_bridge.rs
    border:
    - src/catalog.rs
    - src/lib.rs
    - src/scan_budget.rs
    - src/client_scan_tests.rs
    - tests/fixtures/migration-parity-v1.json
    - macos/Sources/BuildHunter/Bridge/BuildHunterFFI.h
