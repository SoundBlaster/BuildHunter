apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.catalog.snapshot
  title: Versioned client catalog snapshot
  version: 0.1.0-draft.4
  status: draft
intent:
  summary: Give CLI and the application one immutable catalog identity, target metadata and exclusion snapshot.
scope:
  boundedContext: client_catalog
  includes:
  - Versioned CLI/GUI basic plugin documents, stable target descriptors, catalog metadata and owned C handles.
  - Bounded externally originated user JSON documents and package version metadata in CLI and GUI catalogs.
  excludes:
  - User-file persistence/editor UX, filesystem acquisition, Store composition and performance acceptance.
provides:
  capabilities:
  - id: buildhunter.catalog.snapshot
    role: primary
    summary: Validate and own a client-profile catalog until its readers finish.
requires:
  capabilities:
  - id: buildhunter.plugin.policy
    optional: false
    summary: Validate all plugin documents before applying target exclusions.
interfaces:
  inbound:
  - id: snapshot_api
    kind: library
    summary: CatalogSnapshot::basic/with_templates(profile, documents, exclusions), from_catalog, metadata_json and target(id).
  - id: snapshot_ffi
    kind: library
    summary: bh_catalog_abi_version/create/json/destroy plus additive create_with_templates_v1 and static example JSON; version 1, profiles 1 CLI and 2 GUI.
  outbound: []
constraints:
- id: immutable_identity
  level: MUST
  statement: Retain the full validated catalog digest independently of exclusions; preserve disabled descriptors and unknown valid exclusion IDs. Metadata identifies the client profile explicitly.
- id: profiles
  level: MUST
  statement: Supply all 13 stable basic target IDs through public plugin documents. Keep CLI and GUI classification differences explicit; environment and nested admission remain host responsibilities. GUI environment precedence survives excluding that target.
- id: ffi_ownership
  level: MUST
  statement: Copy and validate exclusion bytes before returning a handle. Reject invalid profiles, malformed JSON, inputs above 64 KiB or more than 2048 IDs. Metadata borrows storage until destruction; consumers retain the handle through all scans/readers and destroy exactly once after they finish.
- id: offline_delivery
  level: MUST
  statement: Resolve the exact Hunter/Rifle revisions with one verified core; preserve fresh-cache locked offline CLI build/install through Cargo source replacement and unmodified vendored dependency sources.
- id: external_admission
  level: MUST
  statement: Preserve trusted built-in origin and admit user documents only as External. Reject malformed, incompatible, oversized, reserved-namespace or conflicting packages without returning a partial handle. Limit to 61 user documents at 1 MiB each and the effective catalog's 16 MiB byte budget. The synchronous optional error callback borrows UTF-8 JSON for the call only; catch Rust preparation unwinding and return null on failure. Every composed snapshot, including basic CLI profiles, retains actual catalog package IDs/versions and the validated full-catalog digest. Source buffers may be released after construction.
effects:
  sideEffects: []
evidence:
- id: snapshot_source
  kind: source
  path: src/catalog.rs
  supports:
  - interfaces
  - constraints.immutable_identity
  - constraints.ffi_ownership
  - constraints.external_admission
- id: builtin_source
  kind: source
  path: crates/buildhunter-plugin-policy/src/builtin.rs
  supports:
  - constraints.profiles
- id: root_graph
  kind: source
  path: Cargo.toml
  supports:
  - constraints.offline_delivery
- id: offline_test
  kind: test
  path: scripts/test_offline_cli.py
  supports:
  - constraints.offline_delivery
provenance:
  sourceConfidence:
    intent: high
    boundary: high
    behavior: medium
  notes:
  - R7 GUI user-file delivery is evidenced in validation/user-templates-20261025; CLI file-import UX remains separate. The additive constructor does not change the existing ABI-1 numeric/event layout.
  - R4 clients now use this metadata and target identity. The explicit legacy-file-markers/1 profile preserves C3 compatibility; lossy GUI path actions are disabled (C4). This descriptive draft does not accept future marker harmonization or prove whole-process budgets.
implementationBindings:
- id: catalog_sources
  scope: component
  source:
    repository: https://github.com/SoundBlaster/BuildHunter
    revision: 59508e3b7ecb6ae12458e4c2ff87dc3d645d0b16
  files:
    owned:
    - src/catalog.rs
    - crates/buildhunter-plugin-policy/src/builtin.rs
    border:
    - Cargo.toml
    - .cargo/config.toml
    - macos/Sources/BuildHunter/Bridge/BuildHunterFFI.h
    - scripts/test_offline_cli.py
