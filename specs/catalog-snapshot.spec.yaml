apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.catalog.snapshot
  title: Versioned client catalog snapshot
  version: 0.1.0-draft.1
  status: draft
intent:
  summary: Give CLI and the application one immutable catalog identity, target metadata and exclusion snapshot.
scope:
  boundedContext: client_catalog
  includes:
  - Versioned CLI/GUI basic plugin documents, stable target descriptors, catalog metadata and owned C handles.
  excludes:
  - Default scan cutover, user plugin installation, filesystem acquisition, Store composition and performance acceptance.
provides:
  capabilities:
  - id: buildhunter.catalog.snapshot
    role: primary
    summary: Validate and own a client-profile catalog until its readers finish.
requires:
  capabilities:
  - id: buildhunter.plugin.policy
    optional: false
    summary: Validate all plugin documents before applying target exclusions.
interfaces:
  inbound:
  - id: snapshot_api
    kind: library
    summary: CatalogSnapshot::basic(profile, exclusions), from_catalog, metadata_json and target(id).
  - id: snapshot_ffi
    kind: library
    summary: bh_catalog_abi_version/create/json/destroy; version 1, profiles 1 CLI and 2 GUI.
  outbound: []
constraints:
- id: immutable_identity
  level: MUST
  statement: Retain the full validated catalog digest independently of exclusions; preserve disabled descriptors and unknown valid exclusion IDs. Metadata identifies the client profile explicitly.
- id: profiles
  level: MUST
  statement: Supply all 13 stable basic target IDs through public plugin documents. Keep CLI and GUI classification differences explicit; environment and nested admission remain host responsibilities. GUI environment precedence survives excluding that target.
- id: ffi_ownership
  level: MUST
  statement: Copy and validate exclusion bytes before returning a handle. Reject invalid profiles, malformed JSON, inputs above 64 KiB or more than 2048 IDs. Metadata borrows storage until destruction; consumers retain the handle through all scans/readers and destroy exactly once after they finish.
- id: offline_delivery
  level: MUST
  statement: Resolve the exact Hunter/Rifle revisions with one verified core; preserve fresh-cache locked offline CLI build/install through Cargo source replacement and unmodified vendored dependency sources.
effects:
  sideEffects: []
evidence:
- id: snapshot_source
  kind: source
  path: src/catalog.rs
  supports:
  - interfaces
  - constraints.immutable_identity
  - constraints.ffi_ownership
- id: builtin_source
  kind: source
  path: crates/buildhunter-plugin-policy/src/builtin.rs
  supports:
  - constraints.profiles
- id: root_graph
  kind: source
  path: Cargo.toml
  supports:
  - constraints.offline_delivery
- id: offline_test
  kind: test
  path: scripts/test_offline_cli.py
  supports:
  - constraints.offline_delivery
provenance:
  sourceConfidence:
    intent: high
    boundary: high
    behavior: medium
  notes:
  - R4 preparation; this descriptive draft does not accept C3/C4 decisions or prove default client migration.
implementationBindings:
- id: catalog_sources
  scope: component
  files:
    owned:
    - src/catalog.rs
    - crates/buildhunter-plugin-policy/src/builtin.rs
    border:
    - Cargo.toml
    - .cargo/config.toml
    - macos/Sources/BuildHunter/Bridge/BuildHunterFFI.h
    - scripts/test_offline_cli.py
