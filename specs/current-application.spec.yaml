apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.current.application
  title: Current client assembly
  version: 0.1.0-draft.1
  status: draft
intent:
  summary: Assemble CLI reports and independent macOS scan windows from scanner events with explicit user actions
    and profile differences.
scope:
  boundedContext: module_recovery_and_design
  includes:
  - CLI scan/output/profile path; macOS session generation, shared companion reports, table/diagram, warnings, preferences,
    Finder and export.
  excludes:
  - Full Charts geometry/animation conformance.
  - Store publishing, licensing enforcement or commercial plugins.
  - Persistent target restoration, index, LLM or background maintenance.
provides:
  capabilities:
  - id: buildhunter.current.application
    role: primary
    summary: Assemble CLI reports and independent macOS scan windows from scanner events with explicit user actions
      and profile differences.
requires:
  capabilities:
  - id: buildhunter.current.scan
    optional: false
    summary: Shared Rust scan mechanics; CLI consumes directly, GUI through its bridge.
  - id: buildhunter.current.bridge
    optional: true
    summary: Required for the GUI profile only; CLI calls the Rust scanner directly.
  - id: buildhunter.current.classification
    optional: false
    summary: Client policies and filters determine report eligibility.
interfaces:
  inbound:
  - id: consumer_interface
    kind: library
    summary: Existing CLI main and WindowScanModel.accept/rescan/stop/apply; App scenes and user-selected export/Finder
      operations are separate adapters.
    operations:
    - name: accept_target
      summary: Existing CLI main and WindowScanModel.accept/rescan/stop/apply; App scenes and user-selected export/Finder
        operations are separate adapters.
  outbound: []
constraints:
- id: generation
  level: MUST
  statement: Replacing/rescanning/stopping invalidates prior events by generation; only current scanning generation
    mutates rows. Terminal reduction preserves stopped/partial or incomplete semantics.
- id: shared_report
  level: MUST
  statement: Diagram and warning windows resolve the same scan model via ScanWindowStore and never initiate another
    scan; closing the main scan window stops its scan.
- id: effects_scope
  level: MUST
  statement: Built-in scanning, Finder handoff and path copying do not mutate the scanned filesystem tree.
    Settings write UserDefaults and copying changes the clipboard. User-requested report exports and CLI --profile
    write an explicitly selected output, which may be inside the scanned tree; they are exceptions to scan read-only behavior.
- id: finder_handoff
  level: MUST
  statement: NSWorkspace.activateFileViewerSelecting requests Finder selection; the .opened outcome describes a handoff
    request, not observed Finder completion. Fallback stays within the specified accessRoot check.
- id: view_projection
  level: MUST
  statement: Sorting is a presentation projection; the native table data source owns current row objects. The known
    memory regression was tested historically, not re-executed in this recovery pass.
- id: cli_profile
  level: MUST
  statement: CLI JSON formats paths lossily and lists nested findings while summing only outer roots; language/exclusion/environment
    options and process exit codes belong to this adapter, not generic traversal.
effects:
  sideEffects:
  - id: user_export
    kind: filesystem_write
    summary: Write a user-selected report/profile output, possibly inside the scanned tree; no artifact cleanup.
  - id: finder_request
    kind: event_emit
    summary: Request Finder selection; completion is external.
  - id: preferences
    kind: state_mutation
    summary: Update exclusions/preferences and clipboard on user actions.
