provenance:
  sourceConfidence:
    intent: high
    boundary: medium
    behavior: medium
  notes:
  - Warning action source and runtime evidence are recorded in validation/warning-actions-20261025; draft constraints remain descriptive and do not imply owner acceptance.
  - R4 adds catalog/diagnostic ownership and action-safety prefixes to the current report; rescan clears all three. Metadata/exclusions/rows are captured together before opening export UI. Source/run identities and execution limits are in validation/r4-client-cutover-20261023.
  - R7 introduces the separately described buildhunter.current.templates boundary. Reports now retain optional package version metadata, and admitted target descriptors update Search settings while unknown exclusions remain persisted. Current identities/evidence are in validation/user-templates-20261025.
  - Recovered descriptive constraints from pinned source, not runtime conformance or owner acceptance.
  - Source baseline 48badf9e097783505151dd47fbafe290f0af25e2; per-file hashes, dirty exclusion and map identities
    are in specs/evidence/modules-20261013/source-identity.json.
  - Claim origin, review state, assembly obligations and unresolved decisions are in specs/claim-matrix.md.
