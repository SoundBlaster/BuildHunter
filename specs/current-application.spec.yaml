apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.current.application
  title: Current client assembly
  version: 0.1.0-draft.7
  status: draft
intent:
  summary: Assemble CLI reports and independent macOS scan windows from scanner events with explicit user actions
    and profile differences.
scope:
  boundedContext: module_recovery_and_design
  includes:
  - CLI scan/output/profile path; macOS session generation, shared companion reports, table/diagram, warnings, preferences,
    Finder and export.
  excludes:
  - Full Charts geometry/animation conformance.
  - Store publishing, licensing enforcement or commercial plugins.
  - Persistent target restoration, index, LLM or background maintenance.
provides:
  capabilities:
  - id: buildhunter.current.application
    role: primary
    summary: Assemble CLI reports and independent macOS scan windows from scanner events with explicit user actions
      and profile differences.
requires:
  capabilities:
  - id: buildhunter.current.templates
    optional: true
    summary: GUI Settings includes free file-backed user template authoring; CLI import UX is separate.
  - id: buildhunter.current.scan
    optional: false
    summary: Shared Rust scan mechanics; CLI consumes directly, GUI through its bridge.
  - id: buildhunter.current.bridge
    optional: true
    summary: Required for the GUI profile only; CLI calls the Rust scanner directly.
  - id: buildhunter.current.classification
    optional: false
    summary: Client policies and filters determine report eligibility.
interfaces:
  inbound:
  - id: consumer_interface
    kind: library
    summary: Existing CLI main and WindowScanModel.accept/rescan/stop/apply; App scenes and user-selected export/Finder
      operations are separate adapters.
    operations:
    - name: accept_target
      summary: Existing CLI main and WindowScanModel.accept/rescan/stop/apply; App scenes and user-selected export/Finder
        operations are separate adapters.
  outbound: []
constraints:
- id: live_metric_rendering
  level: MUST
  statement: Update live timer and metric labels immediately without continuous numericText interpolation. Preserve monospaced digits, stable columns, unit labels and accessibility values. Line and sunburst animation policies remain independent. Local macOS font-cache A/B evidence is a workaround result, not a universal rendering-memory guarantee.
- id: resource_disclosure
  level: MUST
  statement: Preserve optional scan budget/high-water/profile-loss metadata in CLI JSON/profile output and GUI JSON exports. Producer loss is separate from rolling history eviction; GUI resource series have gaps and omit missing RAM intervals from integration. Reports and table/diagram/export projections retain bounded admitted source sets per scan, not a process-global memory guarantee. Independent windows and still-stopping generations may overlap.
- id: generation
  level: MUST
  statement: Replacing/rescanning/stopping invalidates prior events by generation; only current scanning generation
    mutates rows. Terminal reduction preserves stopped/partial or incomplete semantics. Stop may later attach one owned catalog/rule-profile snapshot only to the same stopped report, matching its stopped generation, report ID and catalog/exclusions. This exception never admits ordinary artifact, size or warning events and cannot mutate a replacement/rescan report.
- id: shared_report
  level: MUST
  statement: Diagram and warning windows resolve the same scan model via ScanWindowStore and never initiate another
    scan; closing the main scan window stops its scan.
- id: effects_scope
  level: MUST
  statement: Built-in scanning, Finder handoff and path copying do not mutate the scanned filesystem tree.
    Rule profile windows hold finished value snapshots, never start scans and do not share mutable counters. Settings write UserDefaults and copying changes the clipboard. User-requested report exports and CLI --profile/--profile-rules
    write an explicitly selected output, which may be inside the scanned tree; explicit template Save/Save As/Export also writes a user-selected JSON file. These are exceptions to scan read-only behavior and do not authorize cleanup or executable plugins.
- id: finder_handoff
  level: MUST
  statement: NSWorkspace.activateFileViewerSelecting requests Finder selection; the .opened outcome describes a handoff
    request, not observed Finder completion. Fallback stays within the specified accessRoot check.
- id: warning_actions
  level: MUST
  statement: Warning table cells and row backgrounds offer Copy for the context selection and Open in Finder
    for one warning with an exact event-provided relative path under the current real target. Right-clicking
    an unselected cell targets that row; clicking a selected cell retains multi-row Copy in report order.
    Never derive a path by parsing warning text. Reject absolute, parent-traversal, embedded-NUL and unsafe
    lossy-prefix paths. Mocks and locationless/general warnings have no Finder action. Deduplicated display
    messages with conflicting or missing origins permanently lose their action until report reset. Rescan
    clears locations and selection; menu callbacks from another report do nothing. Finder handling retains
    its existing bounded parent fallback and notice. Copy text, keyboard Copy and export strings remain intact.
- id: view_projection
  level: MUST
  statement: Sorting is a presentation projection; the native table data source owns current row objects. The known
    memory regression was tested historically, not re-executed in this recovery pass.
- id: cli_profile
  level: MUST
  statement: CLI JSON formats paths lossily and lists nested findings while summing only outer roots; language/exclusion/environment
    options and process exit codes belong to this adapter, not generic traversal. JSON schema 2 adds full catalog metadata, per-row target IDs and typed diagnostics; GUI exports freeze the same identity with the selected report. Legacy/mock exports without metadata retain schema 1.
effects:
  sideEffects:
  - id: user_export
    kind: filesystem_write
    summary: Write a user-selected report/profile output, possibly inside the scanned tree; no artifact cleanup.
  - id: finder_request
    kind: event_emit
    summary: Request Finder selection; completion is external.
  - id: preferences
    kind: state_mutation
    summary: Update exclusions/preferences and clipboard on user actions.
