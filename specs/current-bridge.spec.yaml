apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: buildhunter.current.bridge
  title: Rust/Swift scan session bridge
  version: 0.1.0-draft.3
  status: draft
intent:
  summary: Carry borrowed Rust scan events into a cancellable Swift stream while owning control handles, settings
    and target access.
scope:
  boundedContext: module_recovery_and_design
  includes:
  - bh_scan_catalog_v1, catalog metadata/target IDs/diagnostics, RustScanEventSource, ScanEventChannel and job/context ownership.
  - Retained numeric bh_scan / finite policy table for compatibility, not default GUI decisions.
  excludes:
  - Lossless GUI identity for arbitrary non-UTF-8 paths.
  - A stable future Hunter or Rifle C ABI.
  - Proof that all UI consumers release historical projections.
provides:
  capabilities:
  - id: buildhunter.current.bridge
    role: primary
    summary: Carry borrowed Rust scan events into a cancellable Swift stream while owning control handles, settings
      and target access.
requires:
  capabilities:
  - id: buildhunter.current.templates
    optional: false
    summary: Reload enabled referenced files before catalog creation, preserving explicit preparation diagnostics.
  - id: buildhunter.catalog.scan
    optional: false
    summary: Versioned catalog events and the owned immutable snapshot.
  - id: buildhunter.current.scan
    optional: false
    summary: Rust call remains alive until workers/callbacks have completed.
  - id: buildhunter.current.classification
    optional: false
    summary: Versioned GUI profile supplies catalog decisions and immutable preferences.
interfaces:
  inbound:
  - id: consumer_interface
    kind: library
    summary: Existing events(for:target:) returns AsyncStream of owned ScanEvents; C payloads are borrowed only during
      callbacks.
    operations:
    - name: events
      summary: Existing events(for:target:) returns AsyncStream of owned ScanEvents; C payloads are borrowed only
        during callbacks.
  outbound: []
constraints:
- id: payload_ownership
  level: MUST
  statement: Copy borrowed path, message, profile and optional resource-budget metadata before returning from C callbacks. Decode profile metadata only within its length bound; absent metadata retains numeric-ABI compatibility and malformed metadata emits a warning. Keep control and retained
    context alive until the Rust call returns; destroy control exactly through RustScanJob.finish. Existing GUI completion
    bytes clamp UInt64 to Int64; IDs use a generation-scoped low-48-bit UUID mapping, not a universal filesystem identity.
- id: backpressure
  level: MUST
  statement: Hold at most 4096 undelivered payloads in ScanEventChannel ring slots; next releases consumed slots.
    close discards queued events and wakes blocked producer; finish drains queued events.
- id: cancellation
  level: MUST
  statement: Cancel the Rust control and close the stream channel without synchronously waiting for scan completion
    on MainActor. Blocking OS reads may still delay the worker return.
- id: access_lifetime
  level: MUST
  statement: Start security-scoped target access before detached scanning and stop a successfully acquired scope after
    the Rust call returns, not immediately when cancellation is requested.
- id: policy_table
  level: MUST
  statement: Default GUI captures exclusions and template registrations, reloads enabled files off MainActor and retains one admitted GUI catalog handle through scan return. Invalid registry/files/catalog fail preparation with a warning directing the user to Settings; no built-in-only or previous-catalog fallback is allowed. Metadata with package versions precedes findings; discovery resolves only known target IDs and copies catalog identity. Typed diagnostics survive transport. No per-candidate Swift callback or finite table is used by default; legacy APIs remain available.
- id: invalid_utf8
  level: MUST
  statement: Rust retains raw path bytes; Swift decodes displayed paths lossily and emits bridge warnings that make
    a completed result incomplete. Disable Finder/Copy actions for the first lossy component and descendants; safe ancestors remain usable. A lossy selected root disables every path action. Raw root bytes are copied from filesystem representation before scanning; display Strings never authorize reconstruction of lossy paths.
effects:
  sideEffects:
  - id: session_access
    kind: state_mutation
    summary: Acquire/release scoped access and control/context lifetime.
  - id: owned_events
    kind: event_emit
    summary: Publish copied generation-tagged Swift events.
