name: Classify changes
on:
  workflow_call:
    outputs:
      heavy:
        description: Whether the event needs application builds and benchmarks
        value: ${{ jobs.classify.outputs.heavy }}
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test change classification
        run: python3 scripts/ci/test_changes.py
      - name: Classify complete event diff
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/changes.py
