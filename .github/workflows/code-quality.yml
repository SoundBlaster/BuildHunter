name: Code quality report

on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'macos/Sources/BuildHunter/**'
      - 'scripts/ci/code_quality.sh'
      - 'scripts/ci/quality_production_sources.py'
      - 'scripts/ci/test_quality_production_sources.py'
      - '.github/workflows/code-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'macos/Sources/BuildHunter/**'
      - 'scripts/ci/code_quality.sh'
      - 'scripts/ci/quality_production_sources.py'
      - 'scripts/ci/test_quality_production_sources.py'
      - '.github/workflows/code-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust parser
        run: python -m pip install tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - name: Verify production source selection
        run: python -m unittest discover -s scripts/ci -p test_quality_production_sources.py
      - name: Measure source
        run: bash scripts/ci/code_quality.sh "$RUNNER_TEMP/code-quality"
      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: ${{ runner.temp }}/code-quality/
          retention-days: 7
          if-no-files-found: error
