name: Scanner performance
# Benchmarks are opt-in and run on one explicitly selected runner.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Benchmark runner (macOS is an explicit opt-in)'
        type: choice
        options: [ubuntu-latest, macos-26]
        default: ubuntu-latest
      baseline_ref:
        description: 'Baseline git revision for comparison'
        type: string
        default: 'HEAD^'
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scanner:
    name: Scanner comparison (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare baseline and candidate on the same fixture
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: python3 scripts/compare_performance.py --baseline-ref "$BASELINE_REF"
      - name: Compare opt-in macOS batch metadata backend
        if: runner.os == 'macOS'
        run: python3 scripts/compare_backends.py
      - name: Record process CPU and RAM and profiling overhead
        run: python3 scripts/profile_resources.py
      - name: Publish job summary
        if: always()
        run: |
          if test -f target/performance/report.md; then
            cat target/performance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f target/performance/bulk/report.md; then
            cat target/performance/bulk/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f target/performance/resources/report.md; then
            cat target/performance/resources/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish raw samples and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-performance-${{ inputs.runner }}
          path: |
            target/performance/report.json
            target/performance/report.md
            target/performance/bulk/report.json
            target/performance/bulk/report.md
            target/performance/resources/report.json
            target/performance/resources/report.md
          if-no-files-found: warn
          retention-days: 7
