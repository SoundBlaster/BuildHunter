name: Stack CI gate publisher
on:
  workflow_run:
    workflows: [Rust CI, macOS CI, Scanner performance]
    types: [in_progress, completed]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed, ready_for_review, converted_to_draft, stacked]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
concurrency:
  # Serialize publishers; each refreshes all open PRs so coalesced events are safe.
  group: stack-ci-status-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: vars.STACK_MACOS_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Privileged workflow: never checkout a PR ref or execute its artifacts.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Refresh current batch evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STACK_MACOS_CI: ${{ vars.STACK_MACOS_CI || 'false' }}
        run: python3 scripts/ci/stack_ci.py publish
