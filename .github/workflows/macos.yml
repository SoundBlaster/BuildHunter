name: macOS CI
# Paid Xcode jobs run only when explicitly requested; never on PR updates or merges.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Select the expensive macOS check to run'
        type: choice
        options: [release, tests, performance, all]
        default: release
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    if: inputs.suite == 'tests' || inputs.suite == 'all'
    name: macOS unit and UI tests
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Build and test
        run: bash scripts/ci/macos.sh test
      - name: Collect Screener traces
        if: always()
        # Pilot: the unsigned test build is not sandboxed, so traces land in the user Caches.
        run: |
          mkdir -p macos/.build/ci/screener-traces
          for root in "$HOME/Library/Caches/Screener/Traces" \
                      "$HOME/Library/Containers/dev.buildhunter.app/Data/Library/Caches/Screener/Traces"; do
            if [ -d "$root" ]; then cp -R "$root"/. macos/.build/ci/screener-traces/; fi
          done
          find macos/.build/ci/screener-traces -maxdepth 2 | head -20
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-evidence
          path: |
            macos/.build/ci/test.xcresult
            macos/.build/ci/test-summary.json
            macos/.build/ci/test.log
            macos/.build/ci/ui-screenshots
            macos/.build/ci/screener-traces
          if-no-files-found: warn
          retention-days: 7
  performance:
    if: inputs.suite == 'performance' || inputs.suite == 'all'
    name: macOS performance tests
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Release clock, memory, and scaling tests
        run: bash scripts/ci/macos.sh performance
      - name: Publish performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-performance-evidence
          path: |
            macos/.build/ci/performance.xcresult
            macos/.build/ci/performance-summary.json
            macos/.build/ci/performance-metrics.json
            macos/.build/ci/performance-metrics
            macos/.build/ci/performance-attachments
            macos/.build/ci/performance.log
          if-no-files-found: warn
          retention-days: 7
  release:
    if: inputs.suite == 'release' || inputs.suite == 'all'
    name: macOS Release build
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Build Release
        run: bash scripts/ci/macos.sh release
      - name: Publish build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-evidence
          path: macos/.build/ci/release.log
          if-no-files-found: warn
          retention-days: 7
