name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, stacked]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      plan_name: rust
  check:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: Rust and CLI (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.rust_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - name: Vendored Hunter primitives
        run: |
          python scripts/verify_hunter_vendor.py
          python scripts/test_hunter_vendor.py
          cargo test --locked --all-features -p build-hunter -p hunter-fs-core
          cargo test --locked --release --all-features -p build-hunter -p hunter-fs-core
          cargo fmt --manifest-path vendor/hunter-fs-core/Cargo.toml --check
      - name: Independent plugin policy checks
        run: |
          cargo fmt --manifest-path crates/buildhunter-plugin-policy/Cargo.toml --check
          cargo test --manifest-path crates/buildhunter-plugin-policy/Cargo.toml --locked
          cargo test --manifest-path crates/buildhunter-plugin-policy/Cargo.toml --locked --release
          cargo clippy --manifest-path crates/buildhunter-plugin-policy/Cargo.toml --locked --all-targets -- -D warnings
      - name: Plugin scanner integration
        run: |
          cargo fmt --manifest-path crates/buildhunter-plugin-scanner/Cargo.toml --check
          cargo test --manifest-path crates/buildhunter-plugin-scanner/Cargo.toml --locked
          cargo test --manifest-path crates/buildhunter-plugin-scanner/Cargo.toml --locked --release
          cargo clippy --manifest-path crates/buildhunter-plugin-scanner/Cargo.toml --locked --all-targets -- -D warnings
      - name: Plugin dependency graph identity
        run: |
          python scripts/test_plugin_dependencies.py
          python scripts/verify_plugin_dependencies.py
      - name: Scoped plugin acquisition with bulk feature
        if: runner.os == 'macOS'
        run: cargo test --manifest-path crates/buildhunter-plugin-scanner/Cargo.toml --locked --release --features build-hunter/macos-bulk-metadata
      - name: Fresh-cache offline CLI regression
        run: python scripts/test_offline_cli.py
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release
      - name: CLI integration tests
        run: |
          python scripts/test_cli.py target/release/build-hunter${{ matrix.suffix }}
          python scripts/test_migration_parity.py target/release/build-hunter${{ matrix.suffix }}
      - name: Performance report tests
        run: |
          python scripts/test_performance_report.py
          python scripts/test_backend_comparison.py
          python scripts/test_analyze_allocations.py

  plugin-contract:
    name: Plugin contract schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/plugin-contract-requirements.txt
      - run: python scripts/test_plugin_contract.py
