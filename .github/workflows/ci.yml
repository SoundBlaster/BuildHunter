name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_platform_checks:
        description: 'Explicitly include macOS and Windows Rust checks'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  check:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: Rust and CLI (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Automatic events are Ubuntu-only. The boolean is honored only on manual dispatch.
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full_platform_checks && '[{"os":"ubuntu-latest","suffix":""},{"os":"macos-26","suffix":""},{"os":"windows-latest","suffix":".exe"}]' || '[{"os":"ubuntu-latest","suffix":""}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - name: Independent plugin policy checks
        run: |
          cargo fmt --manifest-path crates/buildhunter-plugin-policy/Cargo.toml --check
          cargo test --manifest-path crates/buildhunter-plugin-policy/Cargo.toml --locked
          cargo test --manifest-path crates/buildhunter-plugin-policy/Cargo.toml --locked --release
          cargo clippy --manifest-path crates/buildhunter-plugin-policy/Cargo.toml --locked --all-targets -- -D warnings
      - name: Dependency-free CLI offline regression
        run: python scripts/test_offline_cli.py
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release
      - name: CLI integration tests
        run: python scripts/test_cli.py target/release/build-hunter${{ matrix.suffix }}
      - name: Performance report tests
        run: |
          python scripts/test_performance_report.py
          python scripts/test_backend_comparison.py
          python scripts/test_analyze_allocations.py

  plugin-contract:
    name: Plugin contract schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/plugin-contract-requirements.txt
      - run: python scripts/test_plugin_contract.py
      - name: CI cost policy regression
        run: python scripts/ci/test_workflow_policy.py
