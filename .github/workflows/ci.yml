name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Rust and CLI (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
          - os: macos-26
            suffix: ''
          - os: windows-latest
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: CLI integration tests
        run: python scripts/test_cli.py target/release/build-hunter${{ matrix.suffix }}
      - name: Performance report tests
        run: python scripts/test_performance_report.py
