name: BuildHunter
options:
  bundleIdPrefix: dev.buildhunter
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SpecificationCore:
    url: https://github.com/SoundBlaster/SpecificationCore.git
    branch: perf/cross-module-policy
  NestedA11yIDs:
    url: https://github.com/SoundBlaster/NestedA11yIDs.git
    from: 1.0.0
targets:
  BuildHunter:
    type: application
    platform: macOS
    sources:
      - path: Sources/BuildHunter
      - path: Resources/BuildHunter.icon
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.buildhunter.app
        PRODUCT_NAME: BuildHunter
        ASSETCATALOG_COMPILER_APPICON_NAME: BuildHunter
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: Sources/BuildHunter/BuildHunter.entitlements
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: Sources/BuildHunter/Bridge/BuildHunterFFI.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../target/aarch64-apple-darwin/release"
        OTHER_LDFLAGS: "$(inherited) -lbuild_hunter"
    dependencies:
      - package: SpecificationCore
        product: SpecificationCore
      - package: NestedA11yIDs
        product: NestedA11yIDs
    preBuildScripts:
      - name: Build Rust scanner (Apple Silicon)
        script: bash "${SRCROOT}/../scripts/build-rust-macos.sh"
        inputFiles:
          - "$(SRCROOT)/../Cargo.toml"
          - "$(SRCROOT)/../Cargo.lock"
          - "$(SRCROOT)/../src/lib.rs"
        outputFiles:
          - "$(SRCROOT)/../target/aarch64-apple-darwin/release/libbuild_hunter.a"
  BuildHunterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BuildHunterTests
    dependencies:
      - target: BuildHunter
      - package: SpecificationCore
        product: SpecificationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.buildhunter.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  BuildHunterPerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BuildHunterPerformanceTests
    dependencies:
      - target: BuildHunter
      - package: SpecificationCore
        product: SpecificationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.buildhunter.performance-tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  BuildHunterUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/BuildHunterUITests
    dependencies:
      - target: BuildHunter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.buildhunter.uitests
        TEST_TARGET_NAME: BuildHunter
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  BuildHunter:
    build:
      targets:
        BuildHunter: all
        BuildHunterTests: [test]
        BuildHunterUITests: [test]
    test:
      targets:
        - BuildHunterTests
        - BuildHunterUITests
  BuildHunterPerformance:
    build:
      targets:
        BuildHunter: all
        BuildHunterPerformanceTests: [test]
    test:
      config: Release
      targets:
        - BuildHunterPerformanceTests
