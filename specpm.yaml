apiVersion: specpm.dev/v0.1
kind: SpecPackage
metadata:
  id: buildhunter.module_architecture
  name: BuildHunter current boundaries and target module architecture
  version: 0.1.0-draft.40
  summary: Reviewable current boundaries and target modular architecture, including
    integrated Hunter scan engine/session and remaining backend, OS primitive and plugin delivery work.
  license: MIT
  authors:
  - name: Egor Merkushev
specs:
- path: specs/ci-validation.spec.yaml
- path: specs/resource-budget.spec.yaml
- path: specs/current-scan.spec.yaml
- path: specs/current-classification.spec.yaml
- path: specs/current-bridge.spec.yaml
- path: specs/current-application.spec.yaml
- path: specs/hunter-design.spec.yaml
- path: specs/rifle-design.spec.yaml
- path: specs/buildhunter-design.spec.yaml
- path: specs/arsenal-design.spec.yaml
- path: specs/catalog-client-scan.spec.yaml
- path: specs/catalog-snapshot.spec.yaml
- path: specs/plugin-policy.spec.yaml
- path: specs/plugin-scanner.spec.yaml
index:
  provides:
    capabilities:
    - buildhunter.delivery.ci
    - buildhunter.scan.resources
    - buildhunter.current.scan
    - buildhunter.current.classification
    - buildhunter.current.bridge
    - buildhunter.current.application
    - hunter.design.scan
    - rifle.design.rules
    - buildhunter.design.product
    - arsenal.design.catalog
    - buildhunter.catalog.scan
    - buildhunter.catalog.snapshot
    - buildhunter.plugin.policy
    - buildhunter.plugin.scan
  requires:
    capabilities:
    - platform.filesystem.metadata
compatibility:
  platforms:
  - macos
  - linux
  - windows
  languages:
  - name: rust
  - name: swift
keywords:
- descriptive-draft
- architecture
- hunter
- rifle
- artifact-discovery
foreignArtifacts:
- format: hypercode
  path: specs/hypercode/current.hc
  role: documentation
- format: hypercode
  path: specs/hypercode/target.hc
  role: documentation
- format: hypercode-stylesheet
  path: specs/hypercode/current.hcs
  role: documentation
- format: hypercode-stylesheet
  path: specs/hypercode/target.hcs
  role: documentation
- format: hypercode
  path: specs/hypercode/ci.hc
  role: documentation
- format: hypercode-stylesheet
  path: specs/hypercode/ci.hcs
  role: documentation
