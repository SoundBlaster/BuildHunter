[package]
name = "build-hunter"
version = "0.1.0"
edition = "2024"
description = "Read-only build artifact and cache disk usage scanner"
license = "MIT"

[lib]
name = "build_hunter"
crate-type = ["staticlib", "rlib"]

[dependencies]
hunter-fs-core = { path = "vendor/hunter-fs-core" }
buildhunter-plugin-policy = { path = "crates/buildhunter-plugin-policy" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
hunter-fs = { git = "https://github.com/SoundBlaster/Hunter.git", rev = "bfcd75f8996b5a958c81238bb6d44d9fa1f88047" }

[patch."https://github.com/SoundBlaster/Hunter.git"]
hunter-fs-core = { path = "vendor/hunter-fs-core" }

[features]
# Experimental: the default CLI and GUI keep the portable backend.
macos-bulk-metadata = ["hunter-fs-core/macos-bulk-metadata"]

[[bench]]
name = "scanner"
harness = false
