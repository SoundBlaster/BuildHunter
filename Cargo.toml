[package]
name = "build-hunter"
version = "0.1.0"
edition = "2024"
description = "Read-only build artifact and cache disk usage scanner"
license = "MIT"

[lib]
name = "build_hunter"
crate-type = ["staticlib", "rlib"]

[dependencies]
hunter-fs-core = { path = "vendor/hunter-fs-core" }

[features]
# Experimental: the default CLI and GUI keep the portable backend.
macos-bulk-metadata = ["hunter-fs-core/macos-bulk-metadata"]

[[bench]]
name = "scanner"
harness = false
